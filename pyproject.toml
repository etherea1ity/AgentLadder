[project]
name = "klara-agent-ladder"
version = "0.1.0"
description = "Klara minimal agent loop."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43,<47",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
training = [
    "torch>=2.5,<3.0",
]
production-postgres = [
    "psycopg[binary]>=3.2,<4.0",
]
benchmarks = [
    "nltk>=3.8,<4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

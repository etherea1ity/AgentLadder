<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Klara Chapter 8 error recovery and fallback</title>
  <desc id="desc">A typed failure moves through bounded retry, context recovery, or explicit fallback before returning a public result.</desc>
  <defs><linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf2ea"/><stop offset="1" stop-color="#f4e5d5"/></linearGradient><filter id="s8"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#26332c" flood-opacity=".12"/></filter></defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg8)"/>
  <text x="72" y="82" fill="#26372e" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">Recover visibly, fail safely</text>
  <text x="72" y="121" fill="#68776e" font-family="Segoe UI, sans-serif" font-size="18">Every retry, compaction, and model route leaves a typed public trace.</text>
  <g font-family="Segoe UI, sans-serif" filter="url(#s8)">
    <g transform="translate(70 195)"><rect width="258" height="300" rx="26" fill="#fff"/><text x="24" y="44" fill="#69766d" font-size="14" letter-spacing="1.4">TYPED FAILURE</text><rect x="24" y="77" width="210" height="56" rx="12" fill="#f2e4dc"/><text x="42" y="111" fill="#844f47" font-size="16">provider_unavailable</text><rect x="24" y="148" width="210" height="56" rx="12" fill="#eee6d8"/><text x="42" y="182" fill="#7b6248" font-size="16">context too long</text><rect x="24" y="219" width="210" height="56" rx="12" fill="#e7ece7"/><text x="42" y="253" fill="#53685a" font-size="16">tool observation</text></g>
    <path d="M352 345H433" stroke="#8b8e70" stroke-width="4" stroke-linecap="round"/><path d="m423 334 14 11-14 11" fill="none" stroke="#8b8e70" stroke-width="4"/>
    <g transform="translate(459 174)"><rect width="342" height="342" rx="30" fill="#2e4036"/><text x="27" y="48" fill="#dce9dc" font-size="14" letter-spacing="1.4">BOUNDED POLICY</text><text x="28" y="99" fill="#fff" font-size="19" font-weight="600">Transient → retry + backoff</text><text x="28" y="146" fill="#fff" font-size="19" font-weight="600">Too long → PreCompact</text><text x="28" y="193" fill="#fff" font-size="19" font-weight="600">Primary down → fallback</text><text x="28" y="240" fill="#fff" font-size="19" font-weight="600">Tool failed → observation</text><rect x="28" y="277" width="286" height="34" rx="17" fill="#516b5b"/><text x="49" y="300" fill="#e9f2e9" font-size="14">no raw provider body in trace</text></g>
    <path d="M825 345H906" stroke="#8b8e70" stroke-width="4" stroke-linecap="round"/><path d="m896 334 14 11-14 11" fill="none" stroke="#8b8e70" stroke-width="4"/>
    <g transform="translate(932 195)"><rect width="278" height="300" rx="26" fill="#fff"/><text x="24" y="44" fill="#69766d" font-size="14" letter-spacing="1.4">PUBLIC OUTCOME</text><circle cx="46" cy="91" r="8" fill="#b97835"/><text x="68" y="97" fill="#4d5c52" font-size="16">fallback visible</text><circle cx="46" cy="145" r="8" fill="#6e8b6f"/><text x="68" y="151" fill="#4d5c52" font-size="16">actual model stored</text><circle cx="46" cy="199" r="8" fill="#6e8b6f"/><text x="68" y="205" fill="#4d5c52" font-size="16">attempts ordered</text><rect x="24" y="234" width="230" height="42" rx="12" fill="#edf2ed"/><text x="43" y="261" fill="#52665a" font-size="15" font-weight="600">answer or safe failure</text></g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Klara Chapter 6 context assembly</title>
  <desc id="desc">Persona, safe workspace, user, capability, and private session sections assemble into one model request while public trace receives metadata only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f2e9"/><stop offset="1" stop-color="#e4eee4"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#26332c" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <text x="72" y="84" fill="#24332b" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">Context assembly is an explicit boundary</text>
  <text x="72" y="122" fill="#66746c" font-family="Segoe UI, sans-serif" font-size="18">Only the model receives prompt material; traces receive safe structure and metrics.</text>
  <g font-family="Segoe UI, sans-serif" filter="url(#shadow)">
    <g transform="translate(72 174)">
      <rect width="272" height="66" rx="17" fill="#fff"/><circle cx="34" cy="33" r="10" fill="#66856d"/><text x="58" y="41" fill="#2d3c34" font-size="18" font-weight="600">Persona</text>
      <rect y="82" width="272" height="66" rx="17" fill="#fff"/><circle cx="34" cy="115" r="10" fill="#7c927f"/><text x="58" y="123" fill="#2d3c34" font-size="18" font-weight="600">Safe workspace profile</text>
      <rect y="164" width="272" height="66" rx="17" fill="#fff"/><circle cx="34" cy="197" r="10" fill="#98a77f"/><text x="58" y="205" fill="#2d3c34" font-size="18" font-weight="600">User context</text>
      <rect y="246" width="272" height="66" rx="17" fill="#fff"/><circle cx="34" cy="279" r="10" fill="#c3a86e"/><text x="58" y="287" fill="#2d3c34" font-size="18" font-weight="600">Visible capabilities</text>
      <rect y="328" width="272" height="66" rx="17" fill="#fff"/><circle cx="34" cy="361" r="10" fill="#b5794b"/><text x="58" y="369" fill="#2d3c34" font-size="18" font-weight="600">Private session summary</text>
    </g>
    <path d="M372 371H474" stroke="#75917c" stroke-width="4" stroke-linecap="round"/><path d="m464 360 14 11-14 11" fill="none" stroke="#75917c" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(500 188)">
      <rect width="320" height="350" rx="28" fill="#263a31"/>
      <text x="28" y="48" fill="#d9eadb" font-size="15" letter-spacing="2">PRIVATE MODEL REQUEST</text>
      <rect x="28" y="78" width="264" height="46" rx="12" fill="#385044"/><text x="46" y="107" fill="#fff" font-size="16">&lt;workspace_context&gt;</text>
      <rect x="28" y="138" width="264" height="46" rx="12" fill="#385044"/><text x="46" y="167" fill="#fff" font-size="16">&lt;user_context&gt;</text>
      <rect x="28" y="198" width="264" height="46" rx="12" fill="#385044"/><text x="46" y="227" fill="#fff" font-size="16">&lt;capability_context&gt;</text>
      <rect x="28" y="258" width="264" height="64" rx="12" fill="#604d35"/><text x="46" y="287" fill="#fff" font-size="16">&lt;session_context&gt;</text><text x="46" y="309" fill="#eed8b8" font-size="13">untrusted prior context</text>
    </g>
    <path d="M846 285H930" stroke="#75917c" stroke-width="4" stroke-linecap="round"/><path d="m920 274 14 11-14 11" fill="none" stroke="#75917c" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(956 205)">
      <rect width="252" height="160" rx="24" fill="#fff"/>
      <text x="24" y="42" fill="#6c796f" font-size="14" letter-spacing="1.5">PUBLIC TRACE</text>
      <text x="24" y="79" fill="#2f4037" font-size="17" font-weight="600">schema · counts · hash</text>
      <text x="24" y="110" fill="#7a856e" font-size="15">No prompt body</text>
      <text x="24" y="135" fill="#7a856e" font-size="15">No summary content</text>
    </g>
  </g>
</svg>

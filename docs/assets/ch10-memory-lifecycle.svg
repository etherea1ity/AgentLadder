<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Klara governed memory lifecycle</title>
  <desc id="desc">Explicit or reviewed memory enters a tenant partition, is retrieved with hybrid temporal ranking, and can be superseded, forgotten, exported, audited, or hard deleted.</desc>
  <rect width="1120" height="520" rx="30" fill="#f5f2e9"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="62" y="70" font-size="28" font-weight="700" fill="#27312b">Governed long-term memory</text>
    <text x="62" y="101" font-size="15" fill="#667069">Chat history is context. Memory is an explicit, typed, owned record.</text>
    <g transform="translate(62 150)">
      <rect width="210" height="118" rx="20" fill="#fffdf8" stroke="#d7d3c8"/>
      <text x="24" y="38" font-size="14" font-weight="700" fill="#5f7b62">WRITE GATE</text>
      <text x="24" y="68" font-size="15" fill="#27312b">Explicit remember</text>
      <text x="24" y="92" font-size="15" fill="#27312b">or reviewed candidate</text>
    </g>
    <path d="M282 209h58" stroke="#9ca69d" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(350 132)">
      <rect width="280" height="154" rx="22" fill="#e9efe8" stroke="#b9c9ba"/>
      <text x="24" y="38" font-size="14" font-weight="700" fill="#5f7b62">TENANT / USER PARTITION</text>
      <text x="24" y="70" font-size="15" fill="#27312b">type · provenance · time</text>
      <text x="24" y="96" font-size="15" fill="#27312b">confidence · validity · TTL</text>
      <text x="24" y="122" font-size="15" fill="#27312b">supersession · sensitivity</text>
    </g>
    <path d="M640 209h58" stroke="#9ca69d" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(708 150)">
      <rect width="350" height="118" rx="20" fill="#fffdf8" stroke="#d7d3c8"/>
      <text x="24" y="38" font-size="14" font-weight="700" fill="#9b6a32">RETRIEVAL</text>
      <text x="24" y="68" font-size="15" fill="#27312b">lexical + semantic + entity</text>
      <text x="24" y="92" font-size="15" fill="#27312b">recency + temporal validity</text>
    </g>
    <g transform="translate(62 346)">
      <rect width="996" height="104" rx="20" fill="#27312b"/>
      <text x="28" y="38" font-size="13" font-weight="700" fill="#b7cdb9">OWNER CONTROLS</text>
      <text x="28" y="72" font-size="16" fill="#f5f2e9">update → supersede history</text>
      <text x="290" y="72" font-size="16" fill="#f5f2e9">forget → stop retrieval</text>
      <text x="520" y="72" font-size="16" fill="#f5f2e9">export / audit → explain</text>
      <text x="762" y="72" font-size="16" fill="#f5f2e9">delete → purge + verify</text>
    </g>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#9ca69d"/></marker></defs>
</svg>

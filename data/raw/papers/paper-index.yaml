# Agent Ladder Papers Index
# 每篇论文的元数据，按7大分类组织
# 字段说明:
#   id: 唯一标识
#   title: 论文标题
#   authors: 作者列表
#   year: 发表年份
#   venue: 发表会议/期刊 (如有)
#   arxiv: arxiv ID
#   url: 论文链接
#   code: 代码仓库 (可选)
#   category: 所属分类
#   tags: 标签
#   status: to_download | downloaded | converted | indexed
#   relevance: core | important | background
#   description: 一句话描述核心贡献

categories:
  - id: "01-agent-paradigms"
    name: "Agent 基础范式"
    name_en: "Agent Basic Paradigms"
    description: "LLM Agent 的基础概念、核心范式、方法论综述"

  - id: "02-agentic-rag"
    name: "Agentic RAG / Retrieval Control"
    name_en: "Agentic RAG / Retrieval Control"
    description: "具有自主检索控制、自适应检索、证据验证能力的 RAG 系统"

  - id: "03-agent-architecture"
    name: "LLM Agent Architecture"
    name_en: "LLM Agent Architecture"
    description: "Agent 系统架构、多 Agent 协作、框架设计"

  - id: "04-memory-reflection-skill"
    name: "Memory / Reflection / Skill Learning"
    name_en: "Memory / Reflection / Skill Learning"
    description: "Agent 记忆系统、反思学习、技能获取与复用"

  - id: "05-world-models"
    name: "World Models"
    name_en: "World Models"
    description: "LLM 作为世界模型、环境动力学学习、基于模型的规划"

  - id: "06-3d-spatial-world"
    name: "3D / Spatial World Models"
    name_en: "3D / Spatial World Models"
    description: "3D 空间理解、空间推理、视觉世界模型"

  - id: "07-deep-research-tool-use"
    name: "Deep Research / Tool-using Agents"
    name_en: "Deep Research / Tool-using Agents"
    description: "深度研究 Agent、工具使用、联网搜索、自动化科研"


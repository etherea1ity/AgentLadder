[experiment]
name = "klara-moe-grpo"

[execution]
require_slurm = true
require_cuda_training = true
remote_root = "/userhome/cs2/u3665453/AgentLadder"

[model]
vocab_size = 28000
hidden_size = 600
num_layers = 8
num_attention_heads = 10
num_key_value_heads = 2
intermediate_size = 1740
max_sequence_length = 1024
dropout = 0.0
rms_norm_epsilon = 0.000001
rope_theta = 10000.0
pad_token_id = 0
bos_token_id = 1
eos_token_id = 2
tie_word_embeddings = true

[moe]

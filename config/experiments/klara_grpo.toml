[data]
trajectories_path = "data/trajectories/clean.jsonl"

[train]
seed = 20260816
steps = 500
group_size = 8
prompts_per_step = 4
max_new_tokens = 256
learning_rate = 0.000005
weight_decay = 0.01
gradient_clip = 1.0
precision = "bf16"
device = "cuda"
warmup_steps = 20
cosine_min_lr = 0.0
log_every = 10
checkpoint_every = 50
auxiliary_loss_weight = 0.01
eval_prompts = 32
temperature = 1.0
task_success_weight = 1.0
tool_selection_weight = 1.0
valid_args_weight = 1.0
invalid_call_penalty = 1.0
overstep_penalty = 1.0

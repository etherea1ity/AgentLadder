[runtime.loop]
# Final fuse for model turns in one Klara run.
max_turns = 24

# Normal protection against broad tool use.
max_tool_calls = 48

# Repeated identical tool calls are usually retry loops.
max_repeated_tool_calls = 3

# Repeated identical final-answer blocks usually mean no new progress.
max_repeated_final_blocks = 2

# A context-length rejection can force compaction and retry one model turn.
max_prompt_recovery_attempts = 1

[runtime.context]
# Approximate model input envelope. The product reserves space for the system
# prompt and answer before admitting transcript history.
max_input_tokens = 16000
reserved_system_tokens = 2500
reserved_output_tokens = 3500
recent_messages = 10
minimum_recent_messages = 4
summary_max_chars = 2400
tool_result_max_chars = 1200
chars_per_token = 4

[runtime.provider_recovery]
# Omit timeout_seconds to allow long provider thinking calls. Operators can set
# KLARA_PROVIDER_TIMEOUT_SECONDS when a bounded network deadline is required.
retry_attempts = 3
retry_base_delay_seconds = 0.5
retry_max_delay_seconds = 8.0

[runtime.harness]
# Product entrypoints select one named capability profile before loop assembly.
capability_profile = "agent"

[runtime.capability_profiles.agent]
required_model_capabilities = ["tools"]
visible_tools = [
  "current_time",
  "image_generate",
  "web_fetch",
  "web_search",
  "todo_write",
  "skills_list",
  "skill_view",
  "memory_remember",
  "memory_search",
  "memory_update",
  "memory_forget",
  "memory_delete",
  "update_activity",
]
hooks = ["run_projection", "jsonl_trace"]
trace_sink = "jsonl"

schema_version = "klara.three-way-eval.v1"

# qwen no_finetune: config-only preflight for now.
# Weights live on HKU; run this route after they are staged locally.
model = "qwen/qwen3.7-flash"
benchmark_fixture = "data/eval/fixtures/dev_fixture.json"
results_dir = "results"

[harness]
max_steps = 8
max_tokens = 512
temperature = 0.0
timeout_seconds = 120
retry_attempts = 2
retry_base_delay_seconds = 0.0
retry_max_delay_seconds = 0.0
ordered_tool_calls = false

[pricing]
currency = "USD"
input_usd_per_million = 0.0
output_usd_per_million = 0.0

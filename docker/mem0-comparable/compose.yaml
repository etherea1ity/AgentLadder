name: agentladder-mem0-comparable

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4@sha256:318c11b72aaab96b36e9662ad244de3cabd0653a1b942d4e8191f18296c81af0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_service_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  mem0:
    build:
      context: ../..
      dockerfile: docker/mem0-comparable/Dockerfile
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      MEM0_LLM_MODEL: deepseek-v4-flash
      MEM0_LLM_BASE_URL: https://api.deepseek.com/v1
      MEM0_TELEMETRY: "false"
      MEM0_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      MEM0_EMBEDDING_BASE_URL: http://host.docker.internal:18989/v1
      OPENAI_API_KEY: agentladder-local-embedding
      MEM0_COLLECTION: agentladder_mem0_v3_pr4805
      MEM0_QDRANT_HOST: qdrant
      MEM0_QDRANT_PORT: "6333"
      MEM0_HISTORY_DB: /app/history/history.db
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "18888:8000"
    volumes:
      - mem0_history:/app/history
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
volumes:
  mem0_history:
  qdrant_service_data:
